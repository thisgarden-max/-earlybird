  --dawn-0:#FFF7F3; --dawn-1:#FFFFFF; --dawn-2:#FFF0E9; --dawn-3:#FFE2D6;
  --ink-900:#4B3B44; --ink-700:#6E5A66; --ink-500:#8A7583; --ink-400:#A28C9A; --ink-300:#D6C7CF;
  --sun:#FFB39E; --sun-deep:#FF8E72; --sun-ink:#CE5F45; --sun-tint:#FFEDE6; --sun-tint-2:#FFDCCE;
  --gold:#FFD98E; --gold-deep:#E0A233;
  --sky:#9CC4F0; --sky-tint:#EDF4FD;
  --good:#86CFAE; --good-tint:#E8F7F0;
  --alert:#DB6F6B; --alert-tint:#FDEDEC;
  --line:#FFE7DE; --line-strong:#F7D3C6;
  --shadow-sm:0 2px 5px rgba(120,80,90,.06); --shadow-md:0 6px 18px rgba(120,80,90,.11); --shadow-lg:0 18px 48px rgba(120,80,90,.17);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r-sm:12px; --r-md:18px; --r-lg:26px; --r-xl:34px;
  --ease:cubic-bezier(.34,1.32,.5,1);
  --f-display:'Jua','Baloo 2','Pretendard Variable',sans-serif;
  --f-body:'Pretendard Variable','Baloo 2',sans-serif;
  --f-data:'Baloo 2','Pretendard Variable',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(900px 560px at 82% -14%, rgba(255,179,158,.34), transparent 62%),radial-gradient(760px 520px at 2% 104%, rgba(196,190,240,.26), transparent 64%),radial-gradient(620px 460px at 50% 46%, rgba(255,217,142,.16), transparent 70%),var(--dawn-0);background-attachment:fixed;color:var(--ink-900);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--sun-deep);outline-offset:3px;border-radius:var(--r-sm)}
.hidden{display:none !important}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--s5)}
.eyebrow{font-family:var(--f-data);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-400)}
.brandline{font-family:var(--f-data);font-size:11px;letter-spacing:.2em;color:var(--sun-deep);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);padding:11px var(--s4);border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--dawn-1);font-size:14px;font-weight:600;color:var(--ink-900);box-shadow:var(--shadow-sm);transition:transform .16s var(--ease),background .16s var(--ease),border-color .16s var(--ease),box-shadow .16s var(--ease)}
.btn:hover{background:var(--dawn-2);border-color:var(--ink-300);box-shadow:var(--shadow-md)}
.btn:active{transform:scale(.975)}
.btn-primary{background:var(--sun);color:#2A1403;border-color:var(--sun-deep)}
.btn-primary:hover{background:#FF9C57;border-color:var(--sun-deep)}
.btn-ghost{background:transparent;border-color:var(--line);box-shadow:none}
.btn-ghost:hover{background:var(--dawn-2)}
.btn-sm{padding:6px 10px;font-size:12.5px}
.btn-danger{border-color:rgba(196,70,42,.35);color:var(--alert);background:var(--dawn-1)}
.btn-danger:hover{background:var(--alert-tint);border-color:var(--alert)}
.btn[disabled]{opacity:.42;pointer-events:none;box-shadow:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--ink-500);font-weight:600}
.input{width:100%;padding:10px var(--s3);border-radius:var(--r-sm);background:var(--dawn-1);border:1px solid var(--line-strong);font-size:14.5px;transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.input:focus{border-color:var(--sun-deep);outline:none;box-shadow:0 0 0 3px var(--sun-tint)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-400) 50%),linear-gradient(135deg,var(--ink-400) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.input{resize:vertical;font-family:var(--f-data);font-size:13px;line-height:1.7}
.card{background:var(--dawn-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);box-shadow:var(--shadow-sm)}
.notice{font-size:13px;color:var(--ink-500);text-align:center;line-height:1.65}
.notice b{color:var(--ink-900)}
.hint{font-size:12px;color:var(--ink-400);line-height:1.65}
.hint b{color:var(--ink-700)}

/* 학생 화면 */
#v-student{min-height:100dvh;display:flex;flex-direction:column;padding:var(--s5) var(--s4) var(--s6)}
.s-shell{width:100%;max-width:460px;margin:0 auto;flex:1;display:flex;flex-direction:column}
.s-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s5)}
.s-head h1{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:0;line-height:1.2;display:flex;flex-direction:column}
.s-head .logo{width:44px;height:44px;margin-bottom:var(--s2)}
.s-head .brandline{margin-bottom:3px}
.s-date{font-family:var(--f-data);font-size:12px;color:var(--ink-400);text-align:right;line-height:1.5;white-space:nowrap}
.s-date b{display:block;color:var(--ink-900);font-size:15px;font-weight:500}
.s-stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--s5)}
.logo{background:var(--logo) center/contain no-repeat;flex:none;display:inline-block}

.banner{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--dawn-1);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.banner.live{border-color:var(--sun);background:var(--sun-tint)}
.banner.off{border-color:var(--line-strong);background:var(--dawn-2)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ink-300);flex:none}
.banner.live .pulse{background:var(--sun-deep);animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.8)}}
.banner p{font-size:13.5px;color:var(--ink-500)}
.banner b{color:var(--ink-900);font-weight:600}
.banner.live p,.banner.live b{color:var(--sun-ink)}

.me-card{text-align:center}
.me-tag{font-family:var(--f-data);font-size:12.5px;color:var(--sun-deep);letter-spacing:.06em}
.me-name{font-family:var(--f-display);font-size:40px;font-weight:400;letter-spacing:0;line-height:1.05;margin:var(--s2) 0 var(--s1)}
.me-sub{font-size:13px;color:var(--ink-400)}

.tap{width:100%;padding:var(--s5) var(--s4);border-radius:var(--r-lg);background:var(--sun);color:#2A1403;border:1px solid var(--sun-deep);font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:0;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 20px rgba(255,138,61,.32);transition:transform .18s var(--ease),box-shadow .3s var(--ease),background .18s var(--ease)}
.tap small{font-family:var(--f-body);font-size:12.5px;font-weight:600;opacity:.66;letter-spacing:0}
.tap:hover{background:#FF9C57;box-shadow:0 10px 32px rgba(255,138,61,.44)}
.tap:active{transform:scale(.97)}
.tap[disabled]{background:var(--dawn-2);color:var(--ink-300);border-color:var(--line);box-shadow:none;pointer-events:none}

/* 도장 + 오늘 적립 */
.sunburst{display:flex;flex-direction:column;align-items:center;gap:var(--s3);padding:var(--s6) var(--s4);border-radius:var(--r-xl);background:linear-gradient(180deg,var(--sun-tint),var(--dawn-1));border:1px solid var(--sun);animation:rise .5s var(--ease) both;position:relative;overflow:hidden}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sun-mark{width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 50% 42%, var(--gold), var(--sun) 72%);color:#fff;display:grid;place-items:center;font-size:40px;box-shadow:0 0 0 6px var(--sun-tint-2),0 8px 24px rgba(255,138,61,.4);animation:pop .5s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-30deg)}to{opacity:1;transform:none}}
.sunburst h2{font-family:var(--f-display);font-size:22px;font-weight:400;letter-spacing:0;color:var(--ink-900)}
.today-earn{font-family:var(--f-display);font-size:52px;font-weight:400;letter-spacing:0;color:var(--sun-deep);line-height:1}
.today-earn i{font-style:normal;font-size:20px;color:var(--ink-400);font-weight:600;margin-left:3px}
.sunburst p{font-family:var(--f-data);font-size:13px;color:var(--sun-ink)}
.today-arrive{display:flex;flex-direction:column;align-items:center;gap:4px}
.today-arrive span,.upto-box span{font-family:var(--f-data);font-size:13px;font-weight:600;color:var(--ink-400)}
.today-arrive b{font-family:var(--f-display);font-size:60px;font-weight:400;color:var(--sun-deep);line-height:1}
.upto-box{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;max-width:280px;padding:var(--s3) var(--s4);border-radius:var(--r-lg);background:var(--dawn-1);border:2px solid var(--line)}
.upto-box b{font-family:var(--f-display);font-size:30px;font-weight:400;color:var(--ink-900);line-height:1.1}
.upto-box b i{font-style:normal;font-size:16px;color:var(--ink-400);margin:0 2px}
.today-end{font-family:var(--f-data);font-size:15px;font-weight:600;color:var(--ink-500);margin-top:-4px}
.today-end b{font-family:var(--f-display);font-size:24px;font-weight:400;color:var(--ink-900);margin-left:4px}
.sunburst .hint{word-break:keep-all}
.stop-btn{width:100%;max-width:280px;padding:13px;font-size:16px;border:2px solid var(--line-strong);background:var(--dawn-1)}

/* 나의 성적 카드 */
.my-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.my-box{background:var(--dawn-1);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s4);box-shadow:var(--shadow-sm);text-align:center}
.my-box.rank{grid-column:1/-1;background:linear-gradient(120deg,var(--gold),var(--sun));border:0;color:#fff;box-shadow:0 8px 24px rgba(224,101,26,.3)}
.my-box .k{font-size:11.5px;color:var(--ink-400);font-weight:600}
.my-box.rank .k{color:rgba(255,255,255,.85)}
.my-box .v{font-family:var(--f-display);font-size:30px;font-weight:400;letter-spacing:0;line-height:1.1;margin-top:4px;color:var(--ink-900)}
.my-box.rank .v{color:#fff;font-size:40px}
.my-box .v i{font-style:normal;font-size:14px;color:var(--ink-400);font-weight:600;margin-left:2px}
.my-box.rank .v i{color:rgba(255,255,255,.85)}
.streak{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-weight:400}

.s-foot{margin-top:var(--s6);display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.linkbtn{font-size:12.5px;color:var(--ink-400);text-decoration:underline;text-underline-offset:3px;transition:color .16s var(--ease)}
.linkbtn:hover{color:var(--sun-deep)}

.picker{display:flex;flex-direction:column;gap:var(--s3)}
.picker-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.name-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:var(--s2);max-height:260px;overflow-y:auto;padding:2px}
.name-btn{padding:10px 4px;border-radius:var(--r-sm);background:var(--dawn-1);border:1px solid var(--line);font-size:14px;font-weight:600;box-shadow:var(--shadow-sm);transition:transform .14s var(--ease),border-color .14s var(--ease),background .14s var(--ease)}
.name-btn:hover{border-color:var(--sun);background:var(--sun-tint)}
.name-btn:active{transform:scale(.95)}
.name-btn i{display:block;font-style:normal;font-family:var(--f-data);font-size:10.5px;color:var(--ink-400);margin-bottom:2px}

.today-grid{display:grid;grid-template-columns:1fr minmax(250px,310px);gap:var(--s5);align-items:start}
.today-rank{position:sticky;top:var(--s4)}
.t-quote{background:linear-gradient(120deg,var(--sun-tint),var(--dawn-1) 70%);border:2px solid var(--line);border-radius:var(--r-lg);padding:var(--s4) var(--s5);margin-bottom:var(--s5);display:flex;align-items:baseline;gap:var(--s3);cursor:pointer}
.t-quote p{font-family:var(--f-display);font-size:16px;color:var(--ink-900);line-height:1.4;flex:1 1 auto}
.t-quote cite{font-family:var(--f-data);font-size:11px;letter-spacing:.14em;color:var(--sun-ink);font-style:normal;flex:0 0 auto}
.t-quote-foot{margin:var(--s6) 0 0;padding:var(--s5) var(--s6);flex-direction:column;align-items:center;text-align:center;gap:var(--s2)}
.t-quote-foot p{font-size:21px;line-height:1.5;flex:0 0 auto}
.t-quote-foot cite{font-size:12px}
@media (max-width:860px){.t-quote-foot p{font-size:17px}}
@media (max-width:1000px){.today-grid{grid-template-columns:1fr}.today-rank{position:static}}

.s-quote{background:var(--dawn-1);border:2px solid var(--line);border-radius:var(--r-lg);padding:var(--s4) var(--s5);text-align:center;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .18s var(--ease)}
.s-quote:active{transform:scale(.98)}
.s-quote p{font-family:var(--f-display);font-size:16.5px;line-height:1.45;color:var(--ink-900)}
.s-quote p::before{content:"“";color:var(--sun);margin-right:.08em}
.s-quote p::after{content:"”";color:var(--sun);margin-left:.08em}
.s-quote cite{display:block;margin-top:5px;font-family:var(--f-data);font-size:11px;letter-spacing:.14em;color:var(--sun-ink);font-style:normal}

.s-status{background:var(--dawn-1);border:2px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--shadow-sm)}
.s-status .sh{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.s-status .sh h3{font-family:var(--f-display);font-size:14px;font-weight:400}
.s-status .sh b{font-family:var(--f-display);font-size:22px;font-weight:400;color:var(--sun-deep)}
.s-status .sh b i{font-style:normal;font-size:13px;color:var(--ink-300)}
.s-dots{display:flex;flex-wrap:wrap;gap:5px}
.s-dot{flex:0 0 auto;padding:4px 9px;border-radius:99px;border:2px solid var(--line);background:var(--dawn-2);font-size:11.5px;font-weight:600;color:var(--ink-300)}
.s-dot.lit{background:var(--sun-tint);border-color:var(--sun);color:var(--sun-ink)}
.s-dot.me{background:var(--sun);border-color:var(--sun-deep);color:#5A2F1C}
.s-status .none{font-size:12.5px;color:var(--ink-400);text-align:center;padding:var(--s3) 0}

/* 미니 리더보드 (학생 화면) */
.mini-lb{background:var(--dawn-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--shadow-sm)}
.mini-lb h3{font-family:var(--f-display);font-size:14px;font-weight:400;margin-bottom:var(--s3);display:flex;align-items:center;justify-content:space-between}
.mini-lb h3 a{font-family:var(--f-body);font-size:12px;color:var(--ink-400);font-weight:500}
.lb-row{display:flex;align-items:center;gap:var(--s3);padding:8px 0;border-bottom:1px solid var(--line)}
.lb-row:last-child{border-bottom:0}
.lb-row.me{background:var(--sun-tint);margin:0 calc(var(--s4)*-1);padding-left:var(--s4);padding-right:var(--s4)}
.lb-rank{font-family:var(--f-display);font-weight:400;font-size:16px;width:30px;text-align:center;color:var(--ink-400)}
.lb-rank.top1{color:var(--gold-deep)}.lb-rank.top2{color:#9AA0B4}.lb-rank.top3{color:#B87333}
.lb-name{flex:1;font-weight:600;font-size:14px}
.lb-name span{font-family:var(--f-data);font-size:11px;color:var(--ink-400);margin-left:4px}
.lb-time{font-family:var(--f-data);font-size:13px;color:var(--sun-ink);font-weight:500}

/* 교사 */
#v-teacher{min-height:100dvh;display:flex;flex-direction:column}
.t-bar{position:sticky;top:0;z-index:20;background:rgba(255,249,240,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.t-bar-in{display:flex;align-items:center;gap:var(--s5);padding:var(--s3) var(--s5);max-width:1180px;margin:0 auto}
.t-logo{font-family:var(--f-display);font-weight:400;font-size:15.5px;letter-spacing:0;white-space:nowrap;line-height:1.15;display:flex;align-items:center}
.t-logo .logo{width:30px;height:30px;margin-right:var(--s2)}
.t-logo .brandline{display:block;font-size:9.5px;letter-spacing:.16em;margin-bottom:1px}
.t-nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.t-nav::-webkit-scrollbar{display:none}
.t-nav button{padding:7px var(--s3);border-radius:var(--r-sm);font-size:13.5px;font-weight:600;color:var(--ink-400);white-space:nowrap;transition:color .16s var(--ease),background .16s var(--ease)}
.t-nav button:hover{color:var(--ink-900);background:var(--dawn-2)}
.t-nav button.on{color:var(--sun-ink);background:var(--sun-tint)}
.t-main{flex:1;padding:var(--s6) 0 var(--s8)}
.panel{animation:fade .3s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.p-title{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s5)}
.p-title h2{font-family:var(--f-display);font-size:30px;font-weight:400;letter-spacing:0;line-height:1.1}
.p-title .eyebrow,.p-title .brandline{margin-bottom:5px}
.p-actions{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.conn-badge{font-family:var(--f-data);font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap}

.day-flag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;margin-top:6px}
.day-flag.open{background:var(--sun-tint);color:var(--sun-ink);border:1px solid var(--sun)}
.day-flag.closed{background:var(--alert-tint);color:var(--alert);border:1px solid rgba(196,70,42,.35)}

.room{background:var(--dawn-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);box-shadow:var(--shadow-sm)}
.room-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s5)}
.room-count{display:flex;align-items:baseline;gap:var(--s2);font-family:var(--f-display)}
.room-count b{font-size:52px;font-weight:400;letter-spacing:0;line-height:1;color:var(--sun-deep)}
.room-count span{font-size:19px;font-weight:600;color:var(--ink-300)}
.room-count u{text-decoration:none;font-family:var(--f-body);font-size:12.5px;color:var(--ink-500);margin-left:var(--s2);align-self:center}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:var(--s2)}
.seat{position:relative;padding:var(--s3) var(--s2) 10px;border-radius:var(--r-sm);background:var(--dawn-2);border:1px solid var(--line);text-align:center;overflow:hidden;transition:transform .18s var(--ease),border-color .18s var(--ease),background .18s var(--ease),box-shadow .18s var(--ease)}
.seat:hover{transform:translateY(-2px);border-color:var(--ink-300);box-shadow:var(--shadow-md)}
.seat .nm{font-size:14px;font-weight:600;color:var(--ink-300)}
.seat .cum{font-family:var(--f-data);font-size:11.5px;font-weight:600;color:var(--ink-400);margin-top:3px;letter-spacing:.01em}
.seat .foot{display:flex;justify-content:center;align-items:baseline;gap:5px;margin-top:2px;min-height:12px}
.seat .tm{font-family:var(--f-data);font-size:10px;color:transparent}
.seat .earn{font-family:var(--f-data);font-size:10px;color:transparent}
.seat.lit .cum{color:var(--sun-deep)}
.seat.lit{background:linear-gradient(180deg,var(--sun-tint-2),var(--sun-tint));border-color:var(--sun);box-shadow:0 3px 14px rgba(255,138,61,.3)}
.seat.lit .nm{color:var(--ink-900)}
.seat.lit .tm{color:var(--sun-ink)}
.seat.lit .earn{color:var(--sun-deep);font-weight:500}
.room-place{font-family:var(--f-data);font-size:11.5px;color:var(--ink-400);letter-spacing:.04em;text-align:right}
.room-legend{display:flex;gap:var(--s4);margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--line);flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-400)}
.lg i{width:10px;height:10px;border-radius:3px;display:block;border:1px solid var(--line-strong)}
.lg.on i{background:var(--sun);border-color:var(--sun-deep)}
.lg.off i{background:var(--dawn-2)}
.lg.done i{background:var(--dawn-1);border:2px solid var(--line-strong)}
.reset-card{margin-top:var(--s5);border-color:var(--alert-tint);background:linear-gradient(180deg,var(--alert-tint),var(--dawn-1) 70%)}
.reset-card h3{font-family:var(--f-display);font-size:17px;font-weight:400;margin-bottom:var(--s3);color:var(--alert)}
.reset-row{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin-top:var(--s3)}
.reset-row label{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;border:2px solid var(--line-strong);background:var(--dawn-1);font-size:13.5px;font-weight:600;cursor:pointer}
.reset-row input[type=radio]{accent-color:var(--alert)}
.reset-btn{background:var(--alert);border-color:var(--alert);color:#fff}
.reset-btn:hover{filter:brightness(.95)}

/* 리더보드 (교사/전체) */
.podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:var(--s3);align-items:end;margin-bottom:var(--s6)}
.pod{border-radius:var(--r-lg);padding:var(--s4) var(--s3);text-align:center;color:#fff;position:relative;box-shadow:var(--shadow-md)}
.pod .medal{font-size:26px}
.pod .pn{font-family:var(--f-display);font-weight:400;font-size:17px;margin-top:4px;letter-spacing:0}
.pod .pt{font-family:var(--f-data);font-size:12.5px;opacity:.9;margin-top:2px}
.pod.p1{background:linear-gradient(160deg,var(--gold),var(--sun-deep));padding-top:var(--s6);padding-bottom:var(--s6)}
.pod.p2{background:linear-gradient(160deg,#B9C0CE,#8A93A6)}
.pod.p3{background:linear-gradient(160deg,#D89A5E,#B87333)}
.lb-full{background:var(--dawn-1);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
.lb-item{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line)}
.lb-item:last-child{border-bottom:0}
.lb-item .r{font-family:var(--f-display);font-weight:400;font-size:18px;width:34px;text-align:center;color:var(--ink-400)}
.lb-item .nm{flex:1;font-weight:600}
.lb-item .nm span{font-family:var(--f-data);font-size:11.5px;color:var(--ink-400);margin-left:6px}
.lb-item .bar{flex:2;height:8px;background:var(--dawn-3);border-radius:99px;overflow:hidden;max-width:220px}
.lb-item .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--sun));border-radius:99px}
.lb-item .tt{font-family:var(--f-data);font-size:13px;color:var(--sun-ink);font-weight:500;min-width:74px;text-align:right}
.lb-item .st{font-family:var(--f-data);font-size:11px;color:var(--ink-400);min-width:44px;text-align:right}

/* QR */
.qr-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s5);align-items:start}
.qr-stage{display:flex;flex-direction:column;align-items:center;gap:var(--s4);padding:var(--s6);border-radius:var(--r-lg);background:var(--dawn-1);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.qr-frame{background:var(--dawn-1);padding:var(--s4);border-radius:var(--r-md);line-height:0;border:1px solid var(--line)}
.qr-frame img,.qr-frame canvas{display:block;width:220px;height:220px}
.qr-code{font-family:var(--f-data);font-size:34px;letter-spacing:.28em;color:var(--ink-900);padding-left:.28em;font-weight:500}
.qr-meta{text-align:center;font-size:13px;color:var(--ink-500)}
.qr-meta b{color:var(--sun-ink)}
.ttl-bar{width:100%;max-width:280px;height:4px;background:var(--dawn-3);border-radius:99px;overflow:hidden}
.ttl-fill{height:100%;background:var(--sun);transform-origin:left;border-radius:99px}
.side-block{margin-bottom:var(--s4)}
.side-block h3{font-family:var(--f-display);font-size:15px;font-weight:400;margin-bottom:var(--s3)}
.pbtns{display:grid;gap:var(--s2)}
.pbtn{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--dawn-1);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.pbtn.on{border-color:var(--sun);background:var(--sun-tint)}
.pbtn .t{font-weight:600;font-size:14.5px;text-align:left}
.pbtn .t i{display:block;font-style:normal;font-family:var(--f-data);font-size:11px;color:var(--ink-400);font-weight:400;margin-top:1px}
.pbtn .s{font-family:var(--f-data);font-size:11px;color:var(--ink-400)}
.pbtn.on .s{color:var(--sun-ink)}

/* 프로젝터 */
#projector{position:fixed;inset:0;z-index:100;background:radial-gradient(1100px 620px at 50% -8%, var(--sun-tint), var(--dawn-0) 66%);display:flex;flex-direction:column;gap:clamp(10px,1.4vh,20px);padding:clamp(14px,2vh,28px) clamp(16px,2vw,34px);overflow:hidden}
.pj-top{display:flex;align-items:center;gap:var(--s4);flex:0 0 auto}
#projector .pj-brand{font-family:var(--f-data);font-size:clamp(12px,1.4vw,24px);letter-spacing:.26em;color:var(--sun-deep);margin:0 auto}
.pj-now{font-family:var(--f-display);font-size:clamp(16px,2.1vw,36px);color:var(--ink-500);display:flex;align-items:baseline;gap:8px}
.pj-now b{color:var(--ink-900);font-size:1.45em;font-weight:400}
.pj-exit{position:static;flex:0 0 auto}
.pj-live{font-family:var(--f-display);font-size:clamp(16px,2.1vw,36px);color:var(--ink-500);flex:0 0 auto}
.pj-live b{color:var(--sun-deep);font-size:1.45em;font-weight:400}

.pj-quote{flex:0 0 auto;background:var(--dawn-1);border:2px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);padding:clamp(12px,1.8vh,22px) clamp(20px,3vw,40px);text-align:center;cursor:pointer;transition:transform .18s var(--ease)}
.pj-quote:hover{transform:translateY(-2px)}
.pj-quote p{font-family:var(--f-display);font-size:clamp(20px,3vw,58px);color:var(--ink-900);line-height:1.4;margin:0}
.pj-quote p::before{content:"“";color:var(--sun);margin-right:.1em}
.pj-quote p::after{content:"”";color:var(--sun);margin-left:.1em}
.pj-quote cite{display:block;margin-top:8px;font-family:var(--f-data);font-size:clamp(12px,1.4vw,24px);letter-spacing:.16em;color:var(--sun-ink);font-style:normal}

.pj-note{flex:0 0 auto;background:var(--sky-tint);border:2px solid var(--sky);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:clamp(10px,1.5vh,18px) clamp(16px,2.4vw,32px);display:flex;align-items:baseline;gap:clamp(10px,1.4vw,20px)}
.pj-note b{font-family:var(--f-data);font-size:clamp(11px,1.25vw,20px);letter-spacing:.2em;color:#3E6EA8;flex:0 0 auto}
.pj-note p{font-family:var(--f-display);font-size:clamp(17px,2.3vw,44px);color:var(--ink-900);line-height:1.35;margin:0;flex:1 1 auto}
.s-note{background:var(--sky-tint);border:2px solid var(--sky);border-radius:var(--r-lg);padding:var(--s4) var(--s4);margin-bottom:var(--s3)}
.s-note b{display:block;font-family:var(--f-data);font-size:11px;letter-spacing:.18em;color:#3E6EA8;margin-bottom:5px}
.s-note p{font-family:var(--f-display);font-size:16.5px;color:var(--ink-900);line-height:1.5;margin:0}
.note-box{background:var(--sky-tint);border:2px solid var(--sky);border-radius:var(--r-lg);padding:var(--s4);margin-bottom:var(--s5)}
.note-box h3{font-family:var(--f-display);font-size:16px;font-weight:400;color:var(--ink-900);margin-bottom:var(--s3);display:flex;align-items:center;gap:6px}
.note-box textarea{resize:vertical;line-height:1.6;font-family:var(--f-body)}
.pj-grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr minmax(230px,29%);gap:clamp(10px,1.4vw,22px)}
.pj-side{display:flex;flex-direction:column;gap:clamp(10px,1.4vw,22px);min-height:0}
.pj-side .pj-qr-col{flex:0 0 auto}
.pj-side .pj-rank-col{flex:1 1 auto;min-height:0;overflow:auto}
.pj-col{background:var(--dawn-1);border:2px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);padding:clamp(12px,1.8vh,20px);display:flex;flex-direction:column;min-height:0}
.pj-h{font-family:var(--f-data);font-size:clamp(11px,1.3vw,20px);letter-spacing:.24em;text-transform:uppercase;color:var(--sun-deep);margin-bottom:clamp(8px,1.2vh,14px);display:flex;align-items:baseline;gap:8px;flex:0 0 auto}
.pj-h i{font-style:normal;letter-spacing:0;color:var(--ink-400);font-size:1.15em}
.pj-qr-col{align-items:center;justify-content:center;gap:clamp(8px,1.2vh,14px);background:linear-gradient(175deg,var(--sun-tint),var(--dawn-1) 60%)}
#projector .qr-frame{padding:clamp(10px,1.6vh,18px);box-shadow:var(--shadow-md)}
#projector .qr-frame img,#projector .qr-frame canvas{width:min(30vh,22vw,340px);height:min(30vh,22vw,340px)}
/* 가로 화면(교실 아이패드·전자칠판): 오늘의 QR을 옆으로 눕혀 높이를 줄이고, 남는 자리를 이번 달 TOP 10에 줍니다 */
.pj-side .pj-qr-col[data-mode="fixed"]{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto 1fr;column-gap:clamp(10px,1.2vw,20px);row-gap:clamp(4px,.8vh,10px);align-items:center;justify-items:start}
.pj-side .pj-qr-col[data-mode="fixed"] .pj-h{grid-column:1/-1;margin-bottom:0}
.pj-side .pj-qr-col[data-mode="fixed"] .qr-frame{grid-row:2/4;padding:clamp(6px,.9vh,12px)}
#projector .pj-side .pj-qr-col[data-mode="fixed"] .qr-frame img,#projector .pj-side .pj-qr-col[data-mode="fixed"] .qr-frame canvas{width:min(18vh,11.5vw,280px);height:min(18vh,11.5vw,280px)}
.pj-side .pj-qr-col[data-mode="fixed"] .qr-code{align-self:end;font-size:clamp(18px,2vw,40px);letter-spacing:.18em;margin:0;text-align:left}
.pj-side .pj-qr-col[data-mode="fixed"] .pj-sub{align-self:start;word-break:keep-all;text-align:left;font-size:clamp(11px,1.05vw,19px);line-height:1.45;margin:0}
.pj-side .pj-rank-col{flex:1 1 0}
.pj-grid{grid-template-columns:1fr minmax(260px,34%)}
.pj-side .pj-rank{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,auto);grid-auto-flow:column;align-content:start;gap:clamp(4px,.4vh,8px) clamp(5px,.5vw,8px);overflow:hidden}
.pj-side .pj-rank li{min-width:0;gap:clamp(4px,.5vw,10px)}
.pj-side .pj-rank .r{width:1.3em}
.pj-side .pj-rank li{padding:clamp(3px,.6vh,10px) clamp(6px,.7vw,14px)}
.pj-side .pj-rank .r,.pj-side .pj-rank .nm{font-size:clamp(14px,min(1.45vw,1.9vh),30px);line-height:1.25}
.pj-side .pj-rank .hr{font-size:clamp(11px,min(1.1vw,1.5vh),22px)}
#projector .qr-code{font-size:clamp(26px,3.2vw,58px)}
#projector .ttl-bar{max-width:min(60%,320px);height:12px}
#projector .pj-sub{font-size:clamp(12px,1.35vw,23px);color:var(--ink-500);text-align:center;line-height:1.5}
#projector .pj-sub b{color:var(--sun-ink)}

.pj-seats{flex:1 1 auto;min-height:0;overflow:hidden;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;align-content:stretch}
.pj-seat{border-radius:var(--r-md);border:2px solid var(--line);background:var(--dawn-2);padding:3px 4px;text-align:center;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pj-seat .n{font-family:var(--f-display);font-size:var(--sn,clamp(15px,1.9vw,34px));color:var(--ink-300);line-height:1.12;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj-seat .t{font-family:var(--f-display);font-size:calc(var(--st,clamp(11px,1.25vw,22px))*1.25);color:transparent;margin-top:2px;line-height:1.1}
.pj-seat .e{font-family:var(--f-data);font-size:calc(var(--st,clamp(10px,1.15vw,20px))*.95);color:transparent;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj-seat .e small{font-size:.8em;font-weight:500;opacity:.8;margin-right:3px}
.pj-seat.lit{background:linear-gradient(180deg,var(--sun-tint-2),var(--sun-tint));border-color:var(--sun);box-shadow:0 3px 12px rgba(255,142,114,.26)}
.pj-seat.lit .n{color:var(--ink-900)}
.pj-seat.lit .t{color:var(--sun-deep)}
.pj-seat.lit .e{color:var(--ink-500);font-weight:600}
.pj-seat.done{background:var(--dawn-1);border-color:var(--line-strong);box-shadow:none}
.pj-seat.done .t{color:var(--ink-500);font-size:calc(var(--st,clamp(11px,1.25vw,22px))*1.02)}
.pj-seat.fresh{animation:pop .38s var(--ease) both}
.pj-seats .pj-empty{grid-column:1/-1;text-align:center;color:var(--ink-400);padding:clamp(20px,5vh,60px) 0;font-family:var(--f-display);font-size:clamp(15px,1.7vw,22px)}
.pj-legend{flex:0 0 auto;display:flex;gap:var(--s4);padding-top:clamp(8px,1.2vh,14px);margin-top:clamp(8px,1.2vh,14px);border-top:2px solid var(--line)}
.pj-legend .lg{font-size:clamp(11px,1.2vw,20px)}
.pj-wait{text-align:center;color:var(--ink-500);font-family:var(--f-display);font-size:clamp(17px,2.2vw,40px);line-height:1.5;padding:clamp(16px,3vh,40px) var(--s3)}
.pj-wait span{display:block;font-family:var(--f-body);font-size:clamp(12px,1.3vw,22px);color:var(--ink-400);font-weight:600;margin-top:8px}

.pj-rank{flex:1 1 auto;min-height:0;overflow:auto;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.pj-rank li{display:flex;align-items:center;gap:clamp(8px,1vw,16px);padding:clamp(6px,.9vh,14px) clamp(9px,1.1vw,18px);border-radius:var(--r-md);background:var(--dawn-2)}
.pj-rank li.m1{background:linear-gradient(100deg,var(--gold),var(--sun))}
.pj-rank li.m2{background:linear-gradient(100deg,#EAE7F8,#CFC9EF)}
.pj-rank li.m3{background:linear-gradient(100deg,#DCF2E6,#B6E3CD)}
.pj-rank .r{font-family:var(--f-display);font-size:clamp(15px,1.8vw,32px);color:var(--ink-500);width:1.6em;text-align:center;flex:0 0 auto}
.pj-rank li.m1 .r,.pj-rank li.m2 .r,.pj-rank li.m3 .r{color:#5A3A20}
.pj-rank .nm{font-family:var(--f-display);font-size:clamp(15px,1.85vw,33px);color:var(--ink-900);flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj-rank .hr{font-family:var(--f-data);font-size:clamp(12px,1.4vw,25px);font-weight:600;color:var(--sun-ink);flex:0 0 auto}
.pj-rank li.m1 .hr,.pj-rank li.m2 .hr,.pj-rank li.m3 .hr{color:#5A3A20}
.pj-rank .pj-empty{color:var(--ink-400);text-align:center;padding:var(--s5) 0;font-size:14px}

@media (max-width:820px),(max-height:440px){
  .pj-grid{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}
  .pj-side{flex-direction:row;align-items:stretch}
  .pj-side .pj-qr-col{flex:1 1 auto;flex-direction:row;align-items:center;gap:clamp(10px,2vw,20px)}
  .pj-side .pj-qr-col .pj-h{margin-bottom:0}
  #projector .qr-frame img,#projector .qr-frame canvas{width:min(22vh,30vw,260px);height:min(22vh,30vw,260px)}
  .pj-rank-col{display:none}
}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s2);margin-bottom:var(--s5)}
.stat-box{background:var(--dawn-1);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s4);box-shadow:var(--shadow-sm)}
.stat-box .k{font-family:var(--f-data);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-400)}
.stat-box .n{font-family:var(--f-display);font-size:34px;font-weight:400;letter-spacing:0;line-height:1.15;margin-top:6px}
.stat-box .n i{font-style:normal;font-size:14px;color:var(--ink-400);font-weight:600;margin-left:2px}

.pv-box{position:relative;width:100%;overflow:hidden;border:2px solid var(--line-strong);border-radius:var(--r-lg);background:var(--dawn-0);box-shadow:var(--shadow-md)}
.pv-box iframe{border:0;position:absolute;top:0;left:0;transform-origin:0 0;display:block}
.pv-shade{position:absolute;inset:0;cursor:default}
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--dawn-1);box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
thead th{font-family:var(--f-data);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-400);text-align:left;padding:var(--s3) var(--s4);background:var(--dawn-2);border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:11px var(--s4);border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sun-tint)}
td.num,th.num{text-align:right;font-family:var(--f-data)}
.pill{font-family:var(--f-data);font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line-strong);color:var(--ink-500)}
.empty{text-align:center;padding:var(--s8) var(--s5);color:var(--ink-400);font-size:14px;line-height:1.7}
.empty b{display:block;font-family:var(--f-display);font-size:18px;font-weight:400;color:var(--ink-700);margin-bottom:var(--s2)}
#lock{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:var(--s5)}
.lock-card{width:100%;max-width:340px;text-align:center}
.lock-card .logo{width:72px;height:72px;margin:0 auto var(--s3)}
.lock-card h2{font-family:var(--f-display);font-size:24px;font-weight:400;letter-spacing:0;margin:var(--s3) 0 var(--s2)}
.lock-card p{font-size:13px;color:var(--ink-400);margin-bottom:var(--s5)}
.pin-in{width:100%;text-align:center;font-family:var(--f-data);font-size:26px;letter-spacing:.5em;padding-left:.5em;padding-block:var(--s3)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--s4)}
#toast{position:fixed;left:50%;bottom:var(--s6);transform:translate(-50%,20px);z-index:200;padding:11px var(--s5);border-radius:99px;background:var(--ink-900);color:var(--dawn-0);border:1px solid var(--ink-700);font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease);max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.warn{background:var(--alert);border-color:var(--alert)}
@media (max-width:860px){.qr-layout{grid-template-columns:1fr}.wrap{padding:0 var(--s4)}.p-title h2{font-size:25px}.room-count b{font-size:42px}.seats{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}.t-main{padding:var(--s5) 0 var(--s8)}}

/* ===== 말랑 파스텔 레이어 ===== */
body{font-variant-numeric:tabular-nums}
.card,.room,.mini-lb,.lb-full,.qr-stage,.stat-box,.my-box,.pbtn,.banner,.tbl-scroll,.seat,.name-btn,.input,.qr-frame,.sunburst{border-width:2px}
.btn{border-width:2px;border-radius:99px;font-weight:700;padding:11px var(--s5)}
.btn-sm{padding:6px 14px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px) scale(.98)}
.btn-primary{color:#5A2F1C}
.btn-primary:hover{background:var(--sun-tint-2)}
.input{border-radius:var(--r-md)}
.input:focus{box-shadow:0 0 0 4px var(--sun-tint)}
.name-btn{border-radius:99px}
.name-btn:active{transform:scale(.92)}
.t-nav button{border-radius:99px}
.pill,.day-flag,.conn-badge{border-width:2px}

.tap{border-width:3px;border-radius:34px;color:#5A2F1C;box-shadow:0 8px 22px rgba(255,142,114,.38);animation:bob 3.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tap:hover,.tap:active{animation:none}
.tap:hover{background:var(--sun-tint-2);box-shadow:0 12px 30px rgba(255,142,114,.45)}
.tap:active{transform:scale(.96)}

.sun-mark{box-shadow:0 0 0 8px var(--sun-tint-2),0 10px 26px rgba(255,142,114,.38);animation:pop .5s var(--ease) both,float 3.2s ease-in-out .5s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sunburst{background:linear-gradient(180deg,var(--sun-tint),var(--dawn-1) 72%)}

.my-box.rank{background:linear-gradient(120deg,var(--gold),var(--sun));color:#5A3A20;box-shadow:0 8px 22px rgba(255,179,158,.42)}
.my-box.rank .k{color:rgba(90,58,32,.7)}
.my-box.rank .v,.my-box.rank .v i{color:#5A3A20}

.pod{color:#4B3B44}
.pod .pt{opacity:.72}
.pod.p1{background:linear-gradient(160deg,#FFE3AC,#FFB39E)}
.pod.p2{background:linear-gradient(160deg,#EAE7F8,#C8C1EC)}
.pod.p3{background:linear-gradient(160deg,#DCF2E6,#A9DEC6)}
.lb-rank.top1{color:var(--gold-deep)}.lb-rank.top2{color:#8F82CB}.lb-rank.top3{color:#5FB392}
.lb-item .bar{height:12px}
.lb-item .bar i{background:linear-gradient(90deg,var(--gold),var(--sun-deep))}
.seat.lit{box-shadow:0 4px 14px rgba(255,142,114,.3)}
.seat:hover{transform:translateY(-3px)}
.pulse{width:10px;height:10px}
#toast{background:#5B4A55;border-color:#5B4A55;color:#FFF7F3}
#toast.warn{background:var(--alert);border-color:var(--alert);color:#fff}
.ttl-bar{height:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
/* ── 동기부여 카드(학생) ── */
.x-card{word-break:keep-all;background:var(--dawn-1);border:2px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--shadow-sm);margin-top:var(--s3)}
.x-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.x-h h3{font-family:var(--f-display);font-size:15px;font-weight:400;color:var(--ink-900)}
.x-h b{font-family:var(--f-display);font-size:22px;font-weight:400;color:var(--sun-deep);white-space:nowrap}
.x-h b i{font-style:normal;font-size:13px;color:var(--ink-400);margin-left:1px}
.x-row{display:flex;justify-content:space-between;gap:var(--s2);font-family:var(--f-data);font-size:12.5px;font-weight:600;color:var(--ink-500);margin-top:6px}
.x-note{font-size:12.5px;color:var(--ink-500);line-height:1.6;margin-top:var(--s2);word-break:keep-all}
.x-note b{color:var(--sun-ink)}
.bar{height:14px;border-radius:99px;background:var(--dawn-2);border:1px solid var(--line-strong);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--good),#5DBB91);transition:width .8s var(--ease)}
.bar.mine i{background:linear-gradient(90deg,var(--gold),var(--sun-deep))}
.goal-class{background:linear-gradient(180deg,var(--good-tint),var(--dawn-1) 70%);border-color:#CDEBDD}
.goal-class .x-h b{color:#3E9A70}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:99px;border:2px solid var(--line-strong);background:var(--dawn-1);font-family:var(--f-display);font-size:15px;color:var(--ink-700)}
.chip:hover{border-color:var(--sun);color:var(--sun-ink)}
.goal-set{display:flex;align-items:center;gap:6px;margin-top:var(--s3)}
.goal-set .input{max-width:110px;padding:8px 12px}
.goal-set span{font-size:13px;color:var(--ink-500)}
.cmp{display:grid;grid-template-columns:1fr auto;gap:2px var(--s2);padding:var(--s2) 0;border-top:1px dashed var(--line-strong)}
.x-h+.cmp{border-top:0;padding-top:0}
.cmp .k{font-size:12.5px;color:var(--ink-400);font-weight:600;align-self:center}
.cmp b{font-family:var(--f-display);font-size:20px;font-weight:400;color:var(--ink-900);text-align:right}
.cmp em{grid-column:1/-1;font-style:normal;font-size:12.5px;color:var(--ink-500);word-break:keep-all}
.cmp em.up{color:#3E9A70;font-weight:600}
.cmp em.down{color:var(--sun-ink)}
.cal-w,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-w i{font-style:normal;font-size:11px;color:var(--ink-400);font-weight:600;padding-bottom:2px}
.cal-w i:first-child{color:var(--alert)}
.cal span{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-family:var(--f-data);font-size:12.5px;font-weight:600;color:var(--ink-400)}
.cal span.on{background:linear-gradient(160deg,var(--sun-tint-2),var(--sun));color:#5A2F1C}
.cal span.miss{border:2px dashed var(--line-strong);color:var(--ink-400)}
.cal span.future{border:2px solid var(--line);color:var(--ink-500)}

const DB=(()=>{
  const LP='eb::';
  const lsOK=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}})();
  const mem={};
  const enc=v=>JSON.stringify(v),dec=v=>{try{return JSON.parse(v)}catch(e){return v}};
  const encId=k=>encodeURIComponent(k).replace(/\./g,'%2E').replace(/%/g,'_');
  let fs=null,ready=false;
  function initFirebase(){try{if(typeof firebase==='undefined'||!firebase.initializeApp)return false;if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);fs=firebase.firestore();ready=true;return true}catch(e){console.warn('Firebase init 실패:',e);fs=null;ready=false;return false}}
  const col=()=>fs.collection(COLLECTION);
  function lget(k,sh){const key=LP+(sh?'s:':'p:')+k;if(lsOK){const v=localStorage.getItem(key);return v===null?null:dec(v)}return mem[key]??null}
  function lset(k,v,sh){const key=LP+(sh?'s:':'p:')+k;if(lsOK){try{localStorage.setItem(key,enc(v));return true}catch(e){return false}}mem[key]=v;return true}
  function ldel(k,sh){const key=LP+(sh?'s:':'p:')+k;if(lsOK)localStorage.removeItem(key);else delete mem[key];return true}
  function llist(pre,sh){const head=LP+(sh?'s:':'p:');const src=lsOK?Object.keys(localStorage):Object.keys(mem);return src.filter(k=>k.startsWith(head+pre)).map(k=>k.slice(head.length))}
  async function get(k,sh=true){if(sh&&ready){try{const d=await col().doc(encId(k)).get();return d.exists?d.data().v:null}catch(e){return lget(k,sh)}}return lget(k,sh)}
  async function set(k,v,sh=true){if(sh&&ready){try{await col().doc(encId(k)).set({k,v});lset(k,v,sh);return true}catch(e){return lset(k,v,sh)}}return lset(k,v,sh)}
  async function del(k,sh=true){if(sh&&ready){try{await col().doc(encId(k)).delete();ldel(k,sh);return true}catch(e){return ldel(k,sh)}}return ldel(k,sh)}

  }

// 출석 세션은 교사가 열지 않아도 운영요일 openTime~deadline에 자동으로 열립니다.
// 코드는 시각에서 계산되므로 모든 기기가 같은 값을 갖습니다(저장 불필요).
function slotIdx(d=new Date()){const ttl=Math.max(1,Number(CFG.ttlMin)||5);return Math.floor(d.getTime()/(ttl*60000))}
function codeFor(slot){const AB='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let out='';for(let i=0;i<6;i++){let h=2166136261>>>0;const src=`${CFG.school||'FS'}|${slot}|${i}`;for(let k=0;k<src.length;k++){h^=src.charCodeAt(k);h=Math.imul(h,16777619)>>>0}h^=h>>>16;h=Math.imul(h,2246822507)>>>0;h^=h>>>13;h=Math.imul(h,3266489909)>>>0;h=(h^(h>>>16))>>>0;out+=AB[h%32]}return out}
// 교실 화면용 '오늘의 코드': 아침 내내 바뀌지 않고, 날짜가 바뀌면 새 코드가 됩니다.
// 어제 화면을 찍어둔 사진은 오늘 통하지 않습니다.
// 통과 조건은 그대로: LIVE(운영요일 openTime~deadline, '오늘만 닫기' 아님)일 때만.
const dayCode=()=>codeFor('DAY|'+dateKey());
const codeMatches=v=>!!LIVE&&!!v&&(v===LIVE.code||v===LIVE.prevCode||(CFG.fixedQr!==false&&v===dayCode()));

  const ttl=Math.max(1,Number(CFG.ttlMin)||5),slot=slotIdx();
  LIVE={code:codeFor(slot),prevCode:codeFor(slot-1),issuedAt:slot*ttl*60000,ttl,slot,auto:true};
  return LIVE;
}

const hmMin=t=>Number(t.slice(0,2))*60+Number(t.slice(2));

// 입실시각 t(HHMM)로 그날 적립 분 계산: max(earliest, 입실)~deadline
function earnedMinutes(t,endT){
  const inMin=Math.max(mins(CFG.earliest), hmMin(t));
  const end=endT?Math.min(mins(CFG.deadline),hmMin(endT)):mins(CFG.deadline);
  return Math.max(0, end-inMin);
}
// 누적에 더하는 시간: 어제까지의 기록만. 오늘 입실분은 마감까지 있었다고 미리 치지 않고,
// 날짜가 바뀌면(다음 날부터) 누적·순위에 들어갑니다.
function settledMin(date,t,endT){return date<dateKey()?earnedMinutes(t,endT):0}

function windowStatus(d=new Date()){
  const dk=dateKey(d),dow=d.getDay();
  if(!(CFG.opDays||[1,2,3,4,5]).includes(dow))return{ok:false,reason:`${DOW[dow]}요일은 운영 안 함`};
  const cur=nowMin(d);
  if(cur<mins(CFG.openTime))return{ok:false,reason:`${CFG.openTime}부터 출석 가능`,before:true};
  if(cur>=mins(CFG.deadline))return{ok:false,reason:`${CFG.deadline} 마감`,after:true};
  return{ok:true,reason:''};
}

async function computeTotals(){
  const [keys,E]=await Promise.all([DB.list('at:'),loadEnds('')]);
  OPDATES=[...new Set(keys.map(k=>k.split(':')[1]).filter(Boolean))].sort();
  const tot={}; // id -> {min, days:Set, dates:[]}
  for(const k of keys){
    const p=k.split(':');if(p.length<4)continue;
    const [,date,id,t]=p;
    const rec=(tot[id]||={min:0,days:new Set(),dates:[]});
    rec.min+=settledMin(date,t,E[date+'|'+id]); rec.days.add(date); rec.dates.push(date);
  }
  return tot;
}

function computeStreak(dates){
  if(!dates||!dates.length)return 0;
  const set=new Set(dates);
  if(OPDATES.length){                    // 운영한 날(누군가 출석한 날)만 이어서 셉니다
    const today=dateKey();let list=OPDATES.filter(d=>d<=today).reverse();
    if(list[0]===today&&!set.has(today))list=list.slice(1);   // 오늘 아직 안 왔으면 어제부터
    let n=0;for(const d of list){if(set.has(d))n++;else break}return n;
  }
  let streak=0; let d=new Date();
  // 오늘 없으면 어제부터 카운트
  if(!set.has(dateKey(d)))d.setDate(d.getDate()-1);
  for(let i=0;i<400;i++){
    const dk=dateKey(d);
    if(set.has(dk)){streak++;d.setDate(d.getDate()-1)}
    else break;
  }
  return streak;
}

function lbRow(x,i,isMe){const rc=i===0?'top1':i===1?'top2':i===2?'top3':'';const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);return `<div class="lb-row${isMe?' me':''}"><div class="lb-rank ${rc}">${medal}</div><div class="lb-name">${esc(x.s.name)}<span>${x.s.c}반 ${x.s.n}번</span></div><div class="lb-time">${fmtHM(x.min)}</div></div>`}
/* ══ 분석 공통 ══
   모든 출석·종료 기록을 한 번에 모아 학생 화면(목표·비교·달력·배지)과
   교사 화면(요약 문장·살펴볼 학생·추이)이 같은 기준으로 계산하게 합니다.
   '운영한 날' = 한 명이라도 출석한 날. 공휴일·시험 기간은 자연히 빠집니다. */
let OPDATES=[];
async function gatherAll(){
  const [ak,E]=await Promise.all([DB.list('at:'),loadEnds('')]);
  const recs=[],byId={},byDate={};
  for(const k of ak){
    const p=k.split(':');if(p.length<4)continue;
    const [,date,id,t]=p;const end=E[date+'|'+id];
    const r={date,id,t,end,min:earnedMinutes(t,end),settled:settledMin(date,t,end)};
    recs.push(r);(byId[id]||=[]).push(r);(byDate[date]||=[]).push(r);
  }
  for(const id in byId)byId[id].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  OPDATES=Object.keys(byDate).sort();
  return {recs,byId,byDate,opDates:OPDATES};
}
// 운영일 기준 최장 연속
function maxStreakOf(dates,ops){const set=new Set(dates);let best=0,cur=0;for(const d of ops){if(set.has(d)){cur++;best=Math.max(best,cur)}else cur=0}return best}
const hm2txt=m=>`${pad(Math.floor(m/60))}:${pad(Math.round(m)%60)}`;
const durTxt=m=>m>=60?`${Math.floor(m/60)}시간${m%60?` ${m%60}분`:''}`:`${m}분`;
const avgArrive=list=>list.length?Math.round(list.reduce((a,r)=>a+hmMin(r.t),0)/list.length):null;
// 반 목표(시간): 그 달에 따로 정한 값 → 기본 목표 → 인원×10시간 순서로 씁니다.
const baseGoalH=()=>Number(CFG.classGoalH)>0?Number(CFG.classGoalH):Math.max(1,ROSTER.length)*10;
const classGoalH=(mk=monthKey())=>{const v=Number((CFG.classGoals||{})[mk]);return v>0?v:baseGoalH()};
const classGoalMin=(mk=monthKey())=>classGoalH(mk)*60;
// 오늘부터 이번 달 말까지 남은 운영 요일 수(오늘 포함)
function opDaysLeftInMonth(){const d=new Date(),m=d.getMonth();let n=0;const ops=CFG.opDays||[1,2,3,4,5];for(;d.getMonth()===m;d.setDate(d.getDate()+1))if(ops.includes(d.getDay()))n++;return n}

/* ── 학생: 우리 반 공동 목표 ── */
function classGoalHtml(A){
  const mk=monthKey(),goal=classGoalMin();
  const mine=A.recs.filter(r=>r.date.startsWith(mk));
  const sum=mine.reduce((a,r)=>a+r.settled,0);
  const myPart=mine.filter(r=>r.id===ME).reduce((a,r)=>a+r.settled,0);
  const pct=Math.min(100,Math.round(sum/goal*100));
  const m=new Date().getMonth()+1;
  return `<div class="x-card goal-class"><div class="x-h"><h3>🌱 우리 반 ${m}월 목표</h3><b>${pct}<i>%</i></b></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="x-row"><span>${durTxt(sum)} / ${Math.round(goal/60)}시간</span><span>${pct>=100?'목표 달성! 🎉':`${durTxt(goal-sum)} 남음`}</span></div>
    <p class="x-note">${myPart?`내가 보탠 시간 <b>${durTxt(myPart)}</b> · 우리 반 시간의 ${sum?Math.round(myPart/sum*100):0}%`:'내일부터 내 시간이 우리 반 목표에 더해져요'}</p></div>`;
}
/* ── 학생: 개인 목표 ── */
async function myGoalHtml(A){
  const mk=monthKey(),g=Number(await DB.get(`goal:${ME}:${mk}`))||0;
  const got=(A.byId[ME]||[]).filter(r=>r.date.startsWith(mk)).reduce((a,r)=>a+r.settled,0);
  const m=new Date().getMonth()+1;
  if(!g)return `<div class="x-card"><div class="x-h"><h3>🎯 ${m}월 내 목표</h3></div>
    <p class="x-note" style="margin-bottom:var(--s3)">이번 달에 몇 시간 공부할지 정해 보세요.</p>
    <div class="chips">${[5,10,15,20].map(h=>`<button class="chip" data-goal="${h}">${h}시간</button>`).join('')}</div>
    <div class="goal-set"><input class="input" id="gl-in" type="number" min="1" max="200" inputmode="numeric" placeholder="직접 입력"><span>시간</span><button class="btn btn-primary btn-sm" id="gl-save">정하기</button></div></div>`;
  const goal=g*60,pct=Math.min(100,Math.round(got/goal*100)),left=Math.max(0,goal-got),days=opDaysLeftInMonth();
  return `<div class="x-card"><div class="x-h"><h3>🎯 ${m}월 내 목표 ${g}시간</h3><b>${pct}<i>%</i></b></div>
    <div class="bar mine"><i style="width:${pct}%"></i></div>
    <div class="x-row"><span>${durTxt(got)} 채움 (어제까지)</span><span>${left?`${durTxt(left)} 남음`:'목표 달성! 🎉'}</span></div>
    <p class="x-note">${left&&days?`남은 운영일 ${days}일 동안 하루 평균 <b>${Math.ceil(left/days)}분</b>이면 달성해요`:left?'다음 달엔 조금 더 넉넉하게 잡아 볼까요?':'이번 달 목표를 이뤘어요. 정말 잘했어요!'}</p>
    <button class="linkbtn" id="gl-edit" style="margin-top:var(--s2)">목표 바꾸기</button></div>`;
}
function bindGoal(){
  const save=async h=>{h=Math.round(Number(h));if(!(h>=1&&h<=200))return toast('1~200 사이 시간으로 정해 주세요.',true);await DB.set(`goal:${ME}:${monthKey()}`,h);toast(`이번 달 목표 ${h}시간! 화이팅 🌅`);renderMyAndBoard()};
  $$('[data-goal]').forEach(b=>b.onclick=()=>save(b.dataset.goal));
  const s=$('#gl-save');if(s)s.onclick=()=>save($('#gl-in').value);
  const e=$('#gl-edit');if(e)e.onclick=async()=>{await DB.del(`goal:${ME}:${monthKey()}`);renderMyAndBoard()};
}
/* ── 학생: 나와의 비교 (순위 대신 내 성장) ── */
function compareHtml(A){
  const today=dateKey(),mine=(A.byId[ME]||[]).filter(r=>r.date<today);
  const rows=[];
  if(mine.length>=4){
    const n=Math.min(5,Math.floor(mine.length/2));
    const a=avgArrive(mine.slice(-n)),b=avgArrive(mine.slice(-2*n,-n)),d=b-a;
    rows.push(`<div class="cmp"><span class="k">최근 ${n}번 평균 도착</span><b>${hm2txt(a)}</b><em class="${d>0?'up':d<0?'down':''}">${d>0?`▲ 그 전 ${n}번보다 ${d}분 빨라요`:d<0?`그 전 ${n}번보다 ${-d}분 늦어요 · 내일 조금만 일찍!`:`그 전 ${n}번과 같아요`}</em></div>`);
  }
  const d=new Date(),day=d.getDate(),mk=monthKey();
  const pm=new Date(d.getFullYear(),d.getMonth()-1,1),pmk=monthKey(pm);
  const thisM=mine.filter(r=>r.date.startsWith(mk)).reduce((a,r)=>a+r.settled,0);
  const prevM=mine.filter(r=>r.date.startsWith(pmk)&&Number(r.date.slice(8))<day).reduce((a,r)=>a+r.settled,0);
  const hadPrev=mine.some(r=>r.date.startsWith(pmk));
  if(hadPrev||thisM){
    const diff=thisM-prevM;
    rows.push(`<div class="cmp"><span class="k">이번 달 (어제까지)</span><b>${durTxt(thisM)}</b><em class="${hadPrev?diff>=0?'up':'down':''}">${hadPrev?diff>0?`▲ 지난달 같은 기간(1~${day-1}일)보다 ${durTxt(diff)} 더`:diff===0?`지난달 같은 기간과 똑같아요`:`지난달 같은 기간보다 ${durTxt(-diff)} 적어요 · 아직 따라잡을 수 있어요`:'지난달 기록이 없어 이번 달이 기준이 돼요'}</em></div>`);
  }
  const bestDay=mine.length?mine.reduce((a,r)=>hmMin(r.t)<hmMin(a.t)?r:a):null;
  if(bestDay)rows.push(`<div class="cmp"><span class="k">나의 가장 이른 도착</span><b>${prettyTime(bestDay.t)}</b><em>${bestDay.date.slice(5).replace('-','/')} · 이 기록을 깨 볼까요?</em></div>`);
  return `<div class="x-card"><div class="x-h"><h3>📈 나와의 비교</h3></div>${rows.length?rows.join(''):'<p class="x-note">며칠 더 나오면 지난 나와 비교해 드릴게요.</p>'}</div>`;
}
/* ── 학생: 출석 달력 ── */
function calendarHtml(A){

}

/* ══ 교사: 살펴볼 학생 ══ */
function watchHtml(A){
  const today=dateKey(),ops=A.opDates.filter(d=>d<today);
  if(ops.length<3)return `<div class="watch"><h3>👀 살펴볼 학생</h3><p class="hint">운영일이 3일 넘게 쌓이면 여기에 챙겨 볼 학생이 나옵니다.</p></div>`;
  const last5=ops.slice(-5),has=(id,d)=>(A.byDate[d]||[]).some(r=>r.id===id);
  const nm=s=>`<span class="w-chip" data-lgj="${s.id}">${esc(s.name)}</span>`;
  const away=ROSTER.filter(s=>(A.byId[s.id]||[]).length&&!last5.some(d=>has(s.id,d)));
  const never=ROSTER.filter(s=>!(A.byId[s.id]||[]).length);
  const prev=ops[ops.length-1];
  const broke=ROSTER.filter(s=>{if(has(s.id,prev))return false;let n=0;for(let i=ops.length-2;i>=0&&has(s.id,ops[i]);i--)n++;return n>=3}).map(s=>{let n=0;for(let i=ops.length-2;i>=0&&has(s.id,ops[i]);i--)n++;return {s,n}});
  const recent10=new Set(ops.slice(-10)),dl=mins(CFG.deadline);
  const quit=ROSTER.map(s=>({s,n:(A.byId[s.id]||[]).filter(r=>recent10.has(r.date)&&r.end&&dl-hmMin(r.end)>=30).length})).filter(x=>x.n>=3);
  const box=(t,why,list,f)=>`<div class="w-box"><b>${t} <i>${list.length}</i></b><small>${why}</small><div>${list.length?list.map(f).join(''):'<span class="hint">없음</span>'}</div></div>`;
  return `<div class="watch"><h3>👀 살펴볼 학생 <span class="hint">운영일 기준 · 오늘 제외</span></h3><div class="w-grid">
    ${box('요즘 안 나와요','최근 운영일 5일 동안 한 번도 안 옴',away,s=>{const l=(A.byId[s.id]||[]).slice(-1)[0];return `${nm(s)}<em>${l?'마지막 '+l.date.slice(5).replace('-','/'):''}</em>`})}
    ${box('연속이 끊겼어요','3일 이상 연속으로 오다가 직전 운영일에 빠짐',broke,x=>`${nm(x.s)}<em>${x.n}일→0</em>`)}
    ${box('일찍 끝내요','최근 10운영일 중 마감 30분 전 종료 3번 이상',quit,x=>`${nm(x.s)}<em>${x.n}번</em>`)}
    ${box('아직 한 번도 없어요','한 번도 출석하지 않음',never,nm)}
  </div></div>`;
}

/* ══ 교사: 생기부용 요약 문장 ══ */
const dotDate=d=>`${d.slice(0,4)}.${d.slice(5,7)}.${d.slice(8)}.`;
function summaryOf(A,id,scope){
  const today=dateKey();
  const inS=d=>(scope==='all'||d.startsWith(scope))&&d<today;   // 확정된 날(어제까지)만
  const ops=A.opDates.filter(inS),es=(A.byId[id]||[]).filter(r=>inS(r.date));
  if(!es.length||!ops.length)return '';
  const tot=es.reduce((a,r)=>a+r.settled,0),avg=avgArrive(es),ms=maxStreakOf(es.map(r=>r.date),ops);
  const rate=es.length/ops.length;
  let s=`아침 자기주도학습 프로그램(얼리버드)에 ${dotDate(ops[0])}~${dotDate(ops[ops.length-1])} 운영일 ${ops.length}일 중 ${es.length}일 참여하여, 평균 ${hm2txt(avg)}에 등교해 누적 ${durTxt(tot)} 동안 스스로 학습함.`;
  if(ms>=5)s+=` 최장 ${ms}일 연속 참여하며 꾸준한 학습 습관을 보임.`;
  else if(rate>=0.8)s+=` 참여율이 ${Math.round(rate*100)}%로 성실하게 아침 시간을 활용함.`;
  return s;
}

/* ══ 교사: 추이 그래프 (SVG) ══ */
function barSvg(items,{h=170,label=v=>v,sub=null,max=null}={}){
  const W=520,pad=28,bw=(W-pad*2)/items.length,mx=max||Math.max(1,...items.map(x=>x.v));
  return `<svg viewBox="0 0 ${W} ${h+40}" class="trend-svg" role="img">${items.map((x,i)=>{
    const bh=x.v?Math.max(3,(h-30)*x.v/mx):0,X=pad+i*bw+bw*.18,w=bw*.64,Y=h-bh;
    return `<rect x="${X}" y="${Y}" width="${w}" height="${bh}" rx="7" fill="${x.hi?'var(--sun-deep)':'var(--sun)'}"/>
      ${x.v?`<text x="${X+w/2}" y="${Y-6}" text-anchor="middle" class="tv">${label(x.v)}</text>`:''}
      <text x="${X+w/2}" y="${h+16}" text-anchor="middle" class="tl">${x.k}</text>
      ${sub&&x.s!=null?`<text x="${X+w/2}" y="${h+32}" text-anchor="middle" class="ts">${sub(x.s)}</text>`:''}`}).join('')}
    <line x1="${pad}" x2="${W-pad}" y1="${h}" y2="${h}" stroke="var(--line-strong)" stroke-width="2"/></svg>`;
}
function mondayOf(dk){const d=new Date(dk+'T00:00:00');const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dateKey(d)}
function trendHtml(A,scope){
  if(!A.opDates.length)return '';
  // 주별: 최근 8주, 운영일 하루 평균 인원 + 평균 도착
  const weeks={};for(const dk of A.opDates){const w=mondayOf(dk);(weeks[w]||=[]).push(dk)}
  const wk=Object.keys(weeks).sort().slice(-8);
  const wItems=wk.map((w,i)=>{const ds=weeks[w],rs=ds.flatMap(d=>A.byDate[d]);return {k:`${Number(w.slice(5,7))}/${Number(w.slice(8))}~`,v:Math.round(rs.length/ds.length*10)/10,s:avgArrive(rs),hi:i===wk.length-1}});
  // 요일별: 선택한 기간, 운영일 하루 평균 인원 + 평균 도착
  const inS=d=>scope==='all'||d.startsWith(scope);
  const byW={};for(const dk of A.opDates.filter(inS)){const dw=new Date(dk+'T00:00:00').getDay();(byW[dw]||=[]).push(dk)}
  const dItems=(CFG.opDays||[1,2,3,4,5]).map(dw=>{const ds=byW[dw]||[],rs=ds.flatMap(d=>A.byDate[d]);return {k:DOW[dw],v:ds.length?Math.round(rs.length/ds.length*10)/10:0,s:rs.length?avgArrive(rs):null}});
  const lowD=dItems.filter(x=>x.v).sort((a,b)=>a.v-b.v)[0];
  const lastW=wItems[wItems.length-1],prevW=wItems[wItems.length-2];
  const note=[prevW?`이번 주 하루 평균 ${lastW.v}명 (지난주 ${prevW.v}명)`:'',lowD&&dItems.filter(x=>x.v).length>1?`${lowD.k}요일에 가장 적게 와요`:''].filter(Boolean).join(' · ');
  return `<div class="card trend"><div class="trend-h"><h3>주간 추이</h3><span class="hint">${esc(note)}</span></div><div class="trend-grid">
    <div><div class="eyebrow">주별 하루 평균 출석 (최근 8주)</div>${barSvg(wItems,{label:v=>v+'명',sub:m=>hm2txt(m)})}<p class="hint">막대 아래 시각은 그 주 평균 도착 시각</p></div>
    <div><div class="eyebrow">요일별 하루 평균 출석</div>${barSvg(dItems,{label:v=>v+'명',sub:m=>hm2txt(m)})}<p class="hint">선택한 기간 기준 · 아래 시각은 평균 도착</p></div>
  </div></div>`;
}

// 남은 공간에 30칸이 스크롤 없이 들어가도록 칸 수·행 수·글자 크기를 계산
function pjSeatFit(){
  const box=$('#pj-seats');if(!box)return;
  const n=ROSTER.length;if(!n)return;
  const w=box.clientWidth,h=box.clientHeight;
  if(w<40||h<40)return;
  const gap=Math.max(5,Math.min(14,Math.round(w*.009)));
  let best=null;
  for(let c=1;c<=n;c++){
    const r=Math.ceil(n/c);
    const tw=(w-(c-1)*gap)/c,th=(h-(r-1)*gap)/r;
    if(tw<56||th<32)continue;
    const ar=tw/th;if(ar<.8||ar>3.6)continue;
    const score=Math.min(tw/2.1,th);      // 이름 글자 크기를 좌우하는 쪽을 최대로
    if(!best||score>best.score)best={c,r,th,score};
  }
  if(!best){                              // 어떻게 해도 빠듯하면 최대한 촘촘하게
    const c=Math.max(1,Math.round(Math.sqrt(n*w/h)));
    const r=Math.ceil(n/c);
    best={c,r,th:(h-(r-1)*gap)/r};
  }
  box.style.gap=gap+'px';
  box.style.gridTemplateColumns=`repeat(${best.c},minmax(0,1fr))`;
  box.style.gridTemplateRows=`repeat(${best.r},minmax(0,1fr))`;
  box.style.setProperty('--sn',Math.max(11,Math.min(36,best.th*.34))+'px');
  box.style.setProperty('--st',Math.max(9,Math.min(24,best.th*.2))+'px');
}

let logMonth='all',logSort='num',logOpen=null;
async function collectLog(){
  const [keys,E]=await Promise.all([DB.list('at:'),loadEnds('')]);
  const per={},months=new Set();
  for(const k of keys){
    const p=k.split(':');if(p.length<4)continue;
    const [,date,id,t]=p;
    months.add(date.slice(0,7));
    const end=E[date+'|'+id];(per[id]||=[]).push({date,t,end,min:settledMin(date,t,end),today:date===dateKey()});
  }
  for(const id in per)per[id].sort((a,b)=>a.date<b.date?1:-1);
  return {per,months:[...months].sort().reverse()};
}

async function addRoster(replace){
  const raw=$('#ro-paste').value.trim();if(!raw)return toast('붙여넣을 명단이 없습니다.',true);
  const out=replace?[]:[...ROSTER],seen=new Set(out.map(s=>s.id));let added=0,skip=0;
  raw.split(/\r?\n/).forEach(line=>{const p=line.trim().split(/[\t,;]+|\s+/).filter(Boolean);if(p.length<4){if(line.trim())skip++;return}const g=parseInt(p[0],10),c=parseInt(p[1],10),n=parseInt(p[2],10);if(!g||!c||!n){skip++;return}const name=p.slice(3).join(' ').trim();if(!name){skip++;return}const id=`${g}-${c}-${n}`;if(seen.has(id)){skip++;return}seen.add(id);const was=findStudent(id);out.push(was&&was.lead?{g,c,n,name,id,lead:true}:{g,c,n,name,id});added++});
  ROSTER=sortRoster(out);await DB.set('roster',ROSTER);$('#ro-paste').value='';toast(`${added}명 등록.${skip?` (${skip}줄 건너뜀)`:''}`);renderRoster();
}

    <div class="card" style="margin-bottom:var(--s5)"><h3 style="font-family:var(--f-display);font-size:17px;font-weight:400;margin-bottom:var(--s4)">아침 명언</h3>
    <p class="hint" style="margin-bottom:var(--s3)">교실 화면 맨 위에 뜹니다. 기본으로 <b>${QUOTES.length}개</b>가 들어 있고 매일 자동으로 바뀝니다. 화면의 명언을 <b>누르면</b> 다른 명언으로 넘어가요.</p>
    <div class="field"><label>직접 추가할 명언 (한 줄에 하나)</label><textarea class="input" id="cf-quotes" rows="6" style="resize:vertical;line-height:1.7;font-family:var(--f-body)" placeholder="시간은 흘러도 사랑은 남는다 — 담임 선생님&#10;오늘의 나는 어제의 나를 이긴다">${esc(CFG.quotes||'')}</textarea><p class="hint">출처는 <b>—</b> (또는 <b>|</b>) 뒤에 적으세요. 출처가 없으면 문장만 나옵니다.</p></div>
    <label style="display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;border:2px solid var(--line-strong);background:var(--dawn-1);font-size:13.5px;font-weight:600;cursor:pointer;width:fit-content"><input type="checkbox" id="cf-qmine" ${CFG.quotesMineOnly?'checked':''}> 내가 적은 것만 사용</label></div>
    <div class="card" style="margin-bottom:var(--s5)"><h3 style="font-family:var(--f-display);font-size:17px;font-weight:400;margin-bottom:var(--s4)">우리 반 공동 목표</h3>

    <div class="field" style="margin-top:var(--s4)"><label>달마다 따로 정하기</label><div class="goal-months">${goalMonthList().map(mk=>{const v=Number((CFG.classGoals||{})[mk])||'';return `<label class="gm${mk===monthKey()?' now':''}"><span>${mk.slice(0,4)!==monthKey().slice(0,4)?mk.slice(2,4)+'년 ':''}${Number(mk.slice(5))}월${mk===monthKey()?'<em>이번 달</em>':''}</span><input class="input cf-gm" data-mk="${mk}" type="number" min="0" max="5000" inputmode="numeric" value="${v}" placeholder="${baseGoalH()}"><i>시간</i></label>`}).join('')}</div>
    <p class="hint">시험이 있는 달은 낮게, 방학 전 달은 높게 잡는 식으로 쓰세요. 칸을 비우면 흐린 숫자(기본 목표)를 따릅니다. 채운 시간은 매달 1일에 0부터 다시 쌓입니다.</p></div></div>
    <div class="card" style="margin-bottom:var(--s5)"><h3 style="font-family:var(--f-display);font-size:17px;font-weight:400;margin-bottom:var(--s4)">교사용 PIN</h3><div class="form-grid"><div class="field"><label>새 PIN (4~6자리)</label><input class="input" id="cf-pin" type="password" inputmode="numeric" maxlength="6" placeholder="바꾸지 않으려면 비워두세요" autocomplete="new-password"></div></div></div>
    <div style="display:flex;gap:var(--s2);flex-wrap:wrap"><button class="btn btn-primary" id="cf-save">저장</button><button class="btn btn-ghost" id="cf-backup">전체 기록 백업 (CSV)</button></div>
    <p class="hint" style="margin-top:var(--s5);max-width:640px">기록은 온라인에 저장됩니다. 학기 끝에 <b>전체 기록 백업</b>으로 따로 보관해 두시길 권합니다.</p>
    <div class="card reset-card"><h3>기록 리셋</h3>
      <p class="hint">출석·공부 종료 기록을 지웁니다. 명렬표, 학생 핀, 설정은 그대로 남습니다. 지우기 직전에 지울 기록을 <b>CSV로 자동 백업</b>해 드려요.</p>
      <div class="reset-row">
        <label><input type="radio" name="rs-scope" value="today" checked> 오늘 기록만</label>
        <label><input type="radio" name="rs-scope" value="month"> 이번 달 기록</label>
        <label><input type="radio" name="rs-scope" value="all"> 전체 기록 (순위·누적 0부터)</label>
      </div>

  $('#cf-save').onclick=async()=>{const pin=$('#cf-pin').value.trim();if(pin&&!/^\d{4,6}$/.test(pin))return toast('PIN은 숫자 4~6자리.',true);const days=$$('.cf-day:checked').map(c=>Number(c.value)).sort();CFG={...CFG,school:$('#cf-school').value.trim()||'풍산고등학교',className:$('#cf-class').value.trim()||'우리 반',baseUrl:$('#cf-url').value.trim(),openTime:$('#cf-open').value||'07:00',deadline:$('#cf-deadline').value||'08:50',earliest:$('#cf-earliest').value||'06:30',ttlMin:Math.max(1,Number($('#cf-ttl').value)||5),noCode:$('#cf-nocode').checked,fixedQr:$('#cf-fixedqr').checked,pinEachTime:$('#cf-pineach').checked,quotes:$('#cf-quotes').value,quotesMineOnly:$('#cf-qmine').checked,opDays:days.length?days:[1,2,3,4,5],classGoalH:Math.max(0,Math.round(Number($('#cf-goal').value)||0)),classGoals:(()=>{const g={...(CFG.classGoals||{})};$$('.cf-gm').forEach(x=>{const v=Math.round(Number(x.value)||0);if(v>0)g[x.dataset.mk]=v;else delete g[x.dataset.mk]});return g})()};if(pin)CFG.pin=hashPin(pin);await DB.set('config',CFG);applyBrand();updateConnBadge();if(!DB.isRemote)toast('이 기기에만 저장됨 — 온라인 연결 안 됨.',true);else if(pin)toast('저장. 새 PIN이 모든 기기에 적용됩니다.');else toast('저장했습니다.');renderSettings()};
  $('#cf-backup').onclick=backupAll;

}
function goalMonthList(){const d=new Date(),out=new Set();for(let i=-2;i<=5;i++)out.add(monthKey(new Date(d.getFullYear(),d.getMonth()+i,1)));Object.keys(CFG.classGoals||{}).forEach(k=>out.add(k));return [...out].sort()}
async function resetRecords(){
  const scope=($$('[name="rs-scope"]').find(r=>r.checked)||{}).value||'today';
  if(($('#rs-confirm').value||'').trim()!=='리셋')return toast('확인 칸에 리셋 이라고 입력해 주세요.',true);
  const pre=scope==='today'?dateKey():scope==='month'?monthKey():'';
  const label=scope==='today'?'오늘':scope==='month'?'이번 달':'전체';
  const [ak,ek]=await Promise.all([DB.list('at:'+pre),DB.list('en:'+pre)]);
  if(!ak.length&&!ek.length){$('#rs-confirm').value='';return toast(`${label} 기록이 없습니다.`)}
  if(!confirm(`${label} 기록 ${ak.length}건을 지웁니다.\n지운 기록은 되돌릴 수 없어요(백업 CSV는 내려받아 둡니다).\n계속할까요?`))return;
  // 1) 지울 기록 백업
  const E={};ek.forEach(k=>{const p=k.split(':');if(p.length>=4)E[p[1]+'|'+p[2]]=p[3]});
  const rows=[['날짜','학년','반','번호','이름','입실시각','종료시각']];
  ak.sort().forEach(k=>{const p=k.split(':');if(p.length<4)return;const s=findStudent(p[2])||{g:'',c:'',n:'',name:p[2]};const end=E[p[1]+'|'+p[2]];rows.push([p[1],s.g,s.c,s.n,s.name,prettyTime(p[3]),end?prettyTime(end):''])});
  if(rows.length>1)downloadCSV(rows,`얼리버드_리셋전백업_${label}_${dateKey()}.csv`);
  // 2) 삭제 (20건씩)
  const all=[...ak,...ek];let done=0,fail=0;const st=$('#rs-state');
  for(let i=0;i<all.length;i+=20){
    const res=await Promise.all(all.slice(i,i+20).map(k=>DB.delChecked(k)));
    res.forEach(w=>{if(w==='remote'||!DB.isRemote)done++;else fail++});
    if(st)st.textContent=`지우는 중… ${Math.min(i+20,all.length)} / ${all.length}`;
  }
  $('#rs-confirm').value='';
  if(st)st.textContent=fail?`⚠ ${fail}건은 서버에서 지우지 못했습니다. 연결 상태를 확인하고 다시 시도해 주세요.`:`${label} 기록을 리셋했습니다.`;
  await loadToday();MONTHMIN={};
  toast(fail?'일부 기록을 지우지 못했습니다.':`${label} 기록을 리셋했습니다.`,!!fail);
}
async function backupAll(){
  toast('기록을 모으는 중…');
  const [keys,E]=await Promise.all([DB.list('at:'),loadEnds('')]);const rows=[['학교','반','날짜','요일','학년','반','번호','이름','입실시각','종료시각','적립분']];
  keys.sort().forEach(k=>{const p=k.split(':');if(p.length<4)return;const[,date,id,t]=p;const s=findStudent(id)||{g:'',c:'',n:'',name:id};const dd=new Date(date+'T00:00:00');const end=E[date+'|'+id];rows.push([CFG.school,CFG.className,date,DOW[dd.getDay()],s.g,s.c,s.n,s.name,prettyTime(t),end?prettyTime(end):'',earnedMinutes(t,end)])});
  if(rows.length===1)return toast('백업할 기록이 없습니다.',true);
  downloadCSV(rows,`얼리버드_전체백업_${dateKey()}.csv`);toast(`${rows.length-1}건 내려받음.`);
}
function downloadCSV(rows,filename){const body=rows.map(r=>r.map(c=>{const v=String(c??'');return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}).join(',')).join('\r\n');const blob=new Blob(['\uFEFF'+body],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400)}

(async function init(){
  readUrlCode();
  DB.initFirebase();
  if(!DB.isRemote){
    // 학교망에서 firebase 스크립트가 늦게 도착하는 경우가 있어 10초간 다시 시도합니다.
    let tries=0;
    const retry=setInterval(async()=>{
      tries++;
      if(DB.initFirebase()){
        clearInterval(retry);updateConnBadge();pjConn();
        toast('온라인 연결됨 — 다른 기기와 함께 씁니다.');
        await loadCore();
        if(DISPLAY||!$('#projector').classList.contains('hidden')){await loadLive();await loadToday();pjSeats();await pjNote();pjRank()}
        else if(!$('#v-teacher').classList.contains('hidden'))openTab(curTab);
        else renderStudent();
      }else if(tries>=10){
        clearInterval(retry);
        toast('온라인 연결 실패 — 이 기기에만 저장됩니다.',true);
      }
    },1000);
  }
  await loadCore();
  ME=await DB.get('me',false);
  MEOK=await DB.get('meok',false);
  tickClock();setInterval(tickClock,20000);
  if(DISPLAY){                        // 교실 전시 모드: PIN 없이 좌석표 화면만
    $('#v-student').classList.add('hidden');$('#v-teacher').classList.add('hidden');
    await loadLive();await loadToday();
    openProjector(true);
    setInterval(async()=>{if($('#projector').classList.contains('hidden')){await loadLive();openProjector(true)}},60000);
    return;
  }
  showStudent();
  setInterval(()=>{if(!$('#v-student').classList.contains('hidden'))renderStudent()},30000);
})();
</script>
